<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Entrega</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/popups.css">
    <link rel="stylesheet" href="style/cadastrar.css">
</head>
<body>

    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <section class="conteiner" id="page-registrar-entrega">
            <div class="page-header">
                <div>
                    <h1>Registrar Entrega de Doação</h1>
                    <p>Registre que uma família recebeu uma doação.</p>
                </div>
                <button type="button" class="btn btn-save" onclick="window.location.href='consultar-entregas.html'">Consultar entregas</button>
            </div>

            <div id="delivery-message" class="page-message" role="alert" aria-live="polite"></div>

            <form class="form-card" id="delivery-form" action="entregas" method="post">
                <div class="field-row">
                    <div class="field">
                        <label for="familiaId">Família</label>
                        <select id="familiaId" name="familiaId" required>
                            <option value="">Carregando famílias...</option>
                        </select>    
                    </div>

                    <div class="field">
                        <label for="doacaoId">Doação</label>
                        <select id="doacaoId" name="doacaoId" required>
                            <option value="">Carregando doações...</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="quantidadeEntregue">Quantidade entregue</label>
                        <input type="number" id="quantidadeEntregue" name="quantidadeEntregue"
                               placeholder="Ex: 5" min="1" max="1000000" required>
                    </div>

                    <div class="field">
                        <label for="dataEntrega">Data da entrega</label>
                        <input type="text" id="dataEntrega" name="dataEntrega"
                               placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric"
                               data-mask="date" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" required>
                    </div>
                </div>

                <div class="field">
                    <label for="observacao">Observação</label>
                    <textarea id="observacao" name="observacao" rows="3"
                              placeholder="Informações adicionais (opcional)" maxlength="1000"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-delivery" class="btn btn-save">Registrar Entrega</button>
                    <button type="button" class="btn btn-cancel"
                            onclick="window.location.href='consultar-entregas.html'">Cancelar</button>
                </div>
            </form>
            
        </section>
    </div>        
    
    <script src="script/menu.js"></script>
    <script src="script/field-formats.js"></script>
    <script src="script/entrega-form.js"></script>
</body>
</html>
