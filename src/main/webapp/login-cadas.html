<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<style>
    :root {
        --bg: #111827;
        --card: #1F2937;
        --card-alt: #26324a;
        --field: #1B2536;
        --border: #313d4f;
        --text: #F9FAFB;
        --text-sec: #9CA3AF;
        --text-muted: #6B7280;

        --save: #4C7EA8;
        --save-h: #3E6C93;

        --edit: #C9A24B;
        --edit-h: #B58F3C;

        --delete: #B4585C;
        --delete-h: #9C4448;

        --view: #6B8CAE;
        --view-h: #5A7996;

        --cancel: #4B5563;
        --cancel-h: #3F4854;

        --report: #4E9B76;
        --report-h: #3F8563;

        --radius: 10px;
        --shadow: 0 4px 16px rgba(0,0,0,.28);
    }

    body {
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Inter', sans-serif;
        margin-left: 1px;
    }

    .container {
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: var(--radius);
        padding: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-sec);
        font-size: 12px;
    }

    .logo {
        display:flex; align-items:center; gap:10px; margin-bottom:28px;
    }

    .logoimg {
        width:34px; height:34px; border-radius:9px; object-fit: cover;
    }

    .nome-logo {
        font-size:15px; font-weight:600; color: var(--text);
    }

    /* Telas */

    .login {
        display: block;
    }

    .cadastro {
        display: none;
    }

    /* Campos */

    .nome, .email, .senha, .confSenha {
        flex-direction: column;
        display: flex;
        margin-left: 1px;
        margin-bottom: 20px;
    }

    input {
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        color: var(--text);
    }

    input:focus {
        outline: none;
        border-color: var(--save);
    }

    input::placeholder {
        color: var(--text-muted);
    }

    label {
        margin-bottom: 8px;
    }

    /* Campo de senha */

    .senha-input {
        position: relative;
        width: 100%;
    }

    .senha-input input {
        width: 100%;
        box-sizing: border-box;
        padding-right: 40px;
    }

    .senha-input i {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--text-muted);
        z-index: 10;
    }

    /* Botão */

    button {
        background: var(--save);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        color: var(--text);
        cursor: pointer;
        width: 100%;
        margin-bottom: 15px;
    }

    .auth-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }

    button:hover {
        background: var(--save-h);
    }

    /* Textos */

    p {
        color: var(--text-sec);
        font-size: 12px;
        text-align: center;
        margin-bottom: 25px;
        margin-top: 10px;
    }

    h1 {
        color: var(--text);
        font-size: 1.5rem;
        text-align: center;
        margin-bottom: 0;
    }

    a {
        color: var(--save);
        cursor: pointer;
    }

    .auth-message {
        display: none;
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin: 16px 0 4px;
        border-radius: 6px;
        text-align: center;
        line-height: 1.4;
    }

    .auth-message.error {
        display: block;
        color: #FCA5A5;
        background: rgba(180, 88, 92, 0.18);
        border: 1px solid var(--delete);
    }

    .auth-message.success {
        display: block;
        color: #A7F3D0;
        background: rgba(78, 155, 118, 0.18);
        border: 1px solid var(--report);
    }
</style>

<body>

    <div class="container">

        <div class="logo">
            <img class="logoimg" src="img/Logo-Embrace.png" alt="Logo Embrace+">
            <span class="nome-logo">Embrace+</span>
        </div>

        <!-- ================= LOGIN ================= -->

        <form class="login" id="tela-login" action="auth/login" method="post">

            <h1>Login do administrador</h1>

            <p>Acesse o sistema para gerenciar famílias e doações.</p>

            <div id="login-message" class="auth-message" role="alert" aria-live="polite"></div>

            <div class="email">
                <label for="emailLogin">Email</label>
                <input type="email" name="email" id="emailLogin" placeholder="Digite seu email"
                       maxlength="254" autocomplete="email" required>
            </div>


            <div class="senha">

                <label for="senhaLogin">Senha</label>

                <div class="senha-input">
                    <input type="password" name="senha" id="senhaLogin" placeholder="Digite sua senha"
                           maxlength="128" autocomplete="current-password" required>
                    <i class="fa-solid fa-eye" id="alternarSenhaLogin"></i>
                </div>

            </div>

            <button type="submit">Entrar</button>

            <div class="auth-footer">Ainda não tem cadastro?
                <a onclick="mostrarCadastro()">Cadastrar administrador</a>
            </div>

        </form>


        <!-- ================= CADASTRO ================= -->

        <form class="cadastro" id="tela-cadastro" action="auth/register" method="post">

            <h1>Cadastro de Administrador</h1>

            <p>Crie sua conta para acessar o sistema.</p>

            <div id="register-message" class="auth-message" role="alert" aria-live="polite"></div>

            <!-- Nome -->

            <div class="nome">
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo"
                       maxlength="100" autocomplete="name" data-format="title-case" required>
            </div>


            <!-- Email -->

            <div class="email">
                <label for="emailCadastro">Email</label>
                <input type="email" name="email" id="emailCadastro" placeholder="Digite seu email"
                       maxlength="254" autocomplete="email" required>
            </div>


            <!-- Senha -->

            <div class="senha">

                <label for="senhaCadastro">Senha</label>

                <div class="senha-input">
                    <input type="password" name="senha" id="senhaCadastro" placeholder="Digite sua senha"
                           minlength="8" maxlength="128" autocomplete="new-password" required>
                    <i class="fa-solid fa-eye" id="alternarSenhaCadastro"></i>
                </div>

            </div>


            <!-- Confirmar senha -->

            <div class="confSenha">

                <label for="confSenha">Confirmar Senha</label>

                <div class="senha-input">
                    <input type="password" name="confSenha" id="confSenha" placeholder="Confirme sua senha"
                           minlength="8" maxlength="128" autocomplete="new-password" required>
                    <i class="fa-solid fa-eye" id="alternarConfSenha"></i>
                </div>

            </div>


            <button type="submit">Cadastrar</button>


            <div class="auth-footer">Já possui uma conta?
                <a onclick="mostrarLogin()">Entrar</a>
            </div>

        </form>

    </div>

    <script src="script/field-formats.js?v=20261012-2"></script>
    <script>

        // ==============================
        // TROCA DE TELAS
        // ==============================

        const loginForm = document.getElementById('tela-login');
        const registerForm = document.getElementById('tela-cadastro');
        const loginMessage = document.getElementById('login-message');
        const registerMessage = document.getElementById('register-message');

        function clearAuthMessage(element) {
            element.textContent = '';
            element.className = 'auth-message';
        }

        function resetPasswordVisibility(input, icon) {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }

        function clearAuthUrlState() {
            if (window.location.search) {
                window.history.replaceState(null, '', window.location.pathname);
            }
        }

        function mostrarCadastro() {
            loginForm.reset();
            clearAuthMessage(loginMessage);
            clearAuthMessage(registerMessage);
            resetPasswordVisibility(senhaLogin, alternarSenhaLogin);
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            clearAuthUrlState();
        }


        function mostrarLogin() {

            registerForm.reset();
            clearAuthMessage(registerMessage);
            clearAuthMessage(loginMessage);
            resetPasswordVisibility(senhaCadastro, alternarSenhaCadastro);
            resetPasswordVisibility(confSenha, alternarConfSenha);
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            clearAuthUrlState();

        }


        // ==============================
        // MOSTRAR / OCULTAR SENHA - LOGIN
        // ==============================

        const senhaLogin = document.getElementById('senhaLogin');
        const alternarSenhaLogin = document.getElementById('alternarSenhaLogin');

        alternarSenhaLogin.addEventListener('click', function () {

            if (senhaLogin.type === 'password') {

                senhaLogin.type = 'text';

                alternarSenhaLogin.classList.remove('fa-eye');
                alternarSenhaLogin.classList.add('fa-eye-slash');

            } else {

                senhaLogin.type = 'password';

                alternarSenhaLogin.classList.remove('fa-eye-slash');
                alternarSenhaLogin.classList.add('fa-eye');

            }

        });


        // ==============================
        // MOSTRAR / OCULTAR SENHA - CADASTRO
        // ==============================

        const senhaCadastro = document.getElementById('senhaCadastro');
        const alternarSenhaCadastro = document.getElementById('alternarSenhaCadastro');

        alternarSenhaCadastro.addEventListener('click', function () {

            if (senhaCadastro.type === 'password') {

                senhaCadastro.type = 'text';

                alternarSenhaCadastro.classList.remove('fa-eye');
                alternarSenhaCadastro.classList.add('fa-eye-slash');

            } else {

                senhaCadastro.type = 'password';

                alternarSenhaCadastro.classList.remove('fa-eye-slash');
                alternarSenhaCadastro.classList.add('fa-eye');

            }

        });


        // ==============================
        // MOSTRAR / OCULTAR CONFIRMAÇÃO
        // ==============================

        const confSenha = document.getElementById('confSenha');
        const alternarConfSenha = document.getElementById('alternarConfSenha');

        alternarConfSenha.addEventListener('click', function () {

            if (confSenha.type === 'password') {

                confSenha.type = 'text';

                alternarConfSenha.classList.remove('fa-eye');
                alternarConfSenha.classList.add('fa-eye-slash');

            } else {

                confSenha.type = 'password';

                alternarConfSenha.classList.remove('fa-eye-slash');
                alternarConfSenha.classList.add('fa-eye');

            }

        });


        // ==============================
        // MENSAGENS DO BACKEND
        // ==============================

        const query = new URLSearchParams(window.location.search);
        const errorMessages = {
            required_fields: 'Preencha todos os campos obrigatórios.',
            name_too_long: 'O nome deve possuir no máximo 100 caracteres.',
            invalid_email: 'Informe um e-mail válido.',
            weak_password: 'A senha deve ter entre 8 e 128 caracteres, com pelo menos uma letra e um número.',
            password_mismatch: 'As senhas não coincidem.',
            duplicate_email: 'Já existe uma conta cadastrada com este e-mail.',
            login_required: 'Informe seu e-mail e senha.',
            invalid_credentials: 'E-mail ou senha inválidos.',
            session_required: 'Faça login para acessar o sistema.',
            internal: 'Não foi possível concluir a operação. Tente novamente.'
        };
        const successMessages = {
            registered: 'Cadastro realizado com sucesso. Agora você pode entrar.',
            logged_out: 'Você saiu do sistema com segurança.'
        };
        const errorCode = query.get('error');
        const successCode = query.get('success');
        const initialMode = query.get('mode') === 'register' ? 'register' : 'login';

        if (initialMode === 'register') {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        }

        const messageElement = initialMode === 'register' ? registerMessage : loginMessage;
        if (errorCode && errorMessages[errorCode]) {
            messageElement.textContent = errorMessages[errorCode];
            messageElement.classList.add('error');
        } else if (successCode && successMessages[successCode]) {
            messageElement.textContent = successMessages[successCode];
            messageElement.classList.add('success');
        }

        [loginForm, registerForm].forEach(form => {
            form.addEventListener('input', () => {
                clearAuthMessage(form === loginForm ? loginMessage : registerMessage);
                clearAuthUrlState();
            }, { once: true });
            form.addEventListener('submit', () => {
                clearAuthMessage(form === loginForm ? loginMessage : registerMessage);
            });
        });

    </script>

</body>
</html>
