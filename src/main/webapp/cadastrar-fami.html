<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Família</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/popups.css">
    <link rel="stylesheet" href="style/cadastrar.css">
</head>
<body data-page="familias">
    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <section class="conteiner" id="page-cadastrar-familia">
            <div class="page-header">
                <div>
                    <h1>Cadastrar Família</h1>
                    <p>Preencha os dados da família em situação de vulnerabilidade.</p>
                </div>
                <button type="button" class="btn btn-save" onclick="window.location.href='gerenciar-fami.html'">Gerenciar famílias</button>
            </div>

            <div id="family-message" class="page-message" role="alert" aria-live="polite"></div>

            <form class="form-card" action="familias" method="post">
                <div class="field">
                    <label for="nomeResponsavel">Nome do titular da família</label>
                    <input type="text" id="nomeResponsavel" name="nomeResponsavel"
                           placeholder="Nome completo do titular" maxlength="100"
                           data-format="title-case" required>
                </div>
                
                <div class="field-row">
                    <div class="field">
                        <label for="cpf">CPF do titular</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                               maxlength="14" inputmode="numeric" required>
                    </div>
                    <div class="field">
                        <label for="quantidadeMembros">Quantidade de membros da família</label>
                        <input type="number" id="quantidadeMembros" name="quantidadeMembros"
                               placeholder="Ex: 4" min="1" max="100" required>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field" style="flex:2;">
                        <label for="logradouro">Endereço</label>
                        <input type="text" id="logradouro" name="logradouro"
                               placeholder="Rua, avenida..." maxlength="150"
                               data-format="title-case" required>
                    </div>
                    <div class="field">
                        <label for="numeroResidencia">Número</label>
                        <input type="text" id="numeroResidencia" name="numeroResidencia"
                               placeholder="Nº" maxlength="20">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" placeholder="Bairro"
                               maxlength="100" data-format="title-case" required>
                    </div>
                    <div class="field">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Cidade"
                               maxlength="100" data-format="title-case" required>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone"
                               placeholder="(98) 99999-9999" maxlength="15" inputmode="numeric"
                               data-mask="phone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required>
                    </div>
                    <div class="field">
                        <label for="dataCadastro">Data do cadastro</label>
                        <input type="text" id="dataCadastro" value="Definida automaticamente" readonly>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Confirmar Cadastro</button>
                    <button type="button" class="btn btn-cancel" onclick="window.location.href='gerenciar-fami.html'">Cancelar</button>
                </div>
            </form>
        </section>
    </div>    
    
    <script src="script/menu.js"></script>
    <script src="script/field-formats.js?v=20261012-2"></script>
    <script src="script/familia-form.js?v=20261012-2"></script>
</body>
</html>
