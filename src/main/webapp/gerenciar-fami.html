<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Famílias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/popups.css">
    <link rel="stylesheet" href="style/gerenciar.css">
</head>
<body data-page="familias">
    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <section class="conteiner" id="page-gerenciar-familias">
            <div class="page-header">
                <div>
                    <h1>Gerenciar Famílias</h1>
                    <p>Consulte, edite ou remova famílias cadastradas no sistema.</p>
                </div>
                <button type="button" class="btn btn-save" onclick="window.location.href='cadastrar-fami.html'">Cadastrar nova família</button>
            </div>

            <div id="family-message" class="page-message" role="alert" aria-live="polite"></div>

            <div class="list-toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="family-search" placeholder="Buscar família...">
                </div>
            </div>

            <div class="table-conteiner">
                <table id="table-familias">
                    <thead><tr>
                        <th>Titular</th><th>CPF</th><th>Nº de membros</th><th>Telefone</th><th>Endereço</th><th>Data de cadastro</th><th>Ações</th>
                    </tr></thead>

                    <tbody id="tbody-familias">
                        <!-- preenchido pelo JavaScript -->
                    </tbody>
                </table>
            </div>

        </section>    
    </div>
    
    <script src="script/menu.js"></script>
    <script src="script/field-formats.js?v=20261012-2"></script>
    <script src="script/geren-familias.js"></script>
</body>
</html>
