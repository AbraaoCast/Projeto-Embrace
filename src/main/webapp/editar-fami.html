<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Família</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/popups.css">
    <link rel="stylesheet" href="style/cadastrar.css">
</head>
<body>

    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <section class="conteiner" id="page-editar-familia">
            <div class="page-header">
                <div>
                    <h1>Editar Família</h1>
                    <p>Atualize os dados cadastrais da família selecionada.</p>
                </div>
                <button type="button" class="btn btn-cancel" onclick="window.location.href='gerenciar-fami.html'">Voltar</button>
            </div>

            <div id="family-message" class="page-message" role="alert" aria-live="polite"></div>

            <form class="form-card" id="edit-family-form" action="familias/update" method="post">
                <input type="hidden" id="id" name="id">
                <div class="field">
                    <label for="nomeResponsavel">Nome do titular da família</label>
                    <input type="text" id="nomeResponsavel" name="nomeResponsavel"
                           maxlength="100" required>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="cpf">CPF do titular</label>
                        <input type="text" id="cpf" name="cpf" maxlength="14" inputmode="numeric" required>
                    </div>
                    <div class="field">
                        <label for="quantidadeMembros">Quantidade de membros da família</label>
                        <input type="number" id="quantidadeMembros" name="quantidadeMembros"
                               min="1" max="100" required>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field" style="flex:2;">
                        <label for="logradouro">Endereço</label>
                        <input type="text" id="logradouro" name="logradouro" maxlength="150" required>
                    </div>
                    <div class="field">
                        <label for="numeroResidencia">Número</label>
                        <input type="text" id="numeroResidencia" name="numeroResidencia" maxlength="20">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" maxlength="100" required>
                    </div>
                    <div class="field">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" maxlength="100" required>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" maxlength="15"
                               placeholder="(98) 99999-9999" inputmode="numeric" data-mask="phone"
                               pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required>
                    </div>
                    <div class="field">
                        <label for="dataCadastro">Data do cadastro</label>
                        <input type="text" id="dataCadastro" readonly>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Salvar alterações</button>
                    <button type="button" class="btn btn-cancel" onclick="window.location.href='gerenciar-fami.html'">Cancelar</button>
                </div>
            </form>
        </section>

    </div>
    
    <script src="script/menu.js"></script>
    <script src="script/field-formats.js"></script>
    <script src="script/familia-form.js"></script>
</body>
</html>
