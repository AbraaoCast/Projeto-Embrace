<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Família</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/popups.css">
    <link rel="stylesheet" href="style/cadastrar-fami.css">
</head>
<body>

    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <section class="conteiner" id="page-editar-familia">
            <div class="page-header">
                <div>
                    <h1>Editar Família</h1>
                    <p>Atualize os dados cadastrais da família selecionada.</p>
                </div>
                <button class="btn btn-cancel" onclick="showPage('gerenciar-familias')">Voltar</button>
            </div>

            <div class="form-card">
                <div class="field">
                    <label>Nome do titular da família</label>
                    <input type="text" value="">
                </div>

                <div class="field-row">
                    <div class="field">
                        <label>CPF do titular</label>
                        <input type="text" value="">
                    </div>
                    <div class="field">
                        <label>Quantidade de membros da família</label>
                        <input type="number" value="">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field" style="flex:2;">
                        <label>Endereço</label>
                        <input type="text" value="">
                    </div>
                    <div class="field">
                        <label>Número</label>
                        <input type="text" value="">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label>Bairro</label>
                        <input type="text" value="">
                    </div>
                    <div class="field">
                        <label>Cidade</label>
                        <input type="text" value="">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label>Telefone</label>
                        <input type="text" value="">
                    </div>
                    <div class="field">
                        <label>Data do cadastro</label>
                        <input type="date" value="">
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-save" onclick="showToast('Dados da família atualizados com sucesso.'); showPage('gerenciar-familias');">Salvar alterações</button>
                    <button class="btn btn-cancel" onclick="showPage('gerenciar-familias')">Cancelar</button>
                </div>
            </div>
        </section>

    </div>
    
    <script src="script/menu.js"></script>
</body>
</html>
