<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/popups.css">
    <link rel="stylesheet" href="style/gerenciar.css">
    <link rel="stylesheet" href="style/cadastrar.css">
    <link rel="stylesheet" href="style/dashboard.css">
</head>
<body>

    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <section class="conteiner" id="page-gerenciar-doacoes">
            
            <div class="page-header">
                <div>
                    <h1>Relatórios</h1>
                    <p>Gere e exporte relatórios de famílias, doações e entregas.</p>
                </div>
                <button class="btn btn-download" onclick="window.location.href='cadastrar-doacao.html'">
                    <i class="fa-solid fa-download"></i>
                    Baixar relatório PDF
                </button>
            </div>

            <div class="cards">
                <div class="card">
                    <div class="card-value">5</div>
                    <div class="card-label">Total de famílias</div>
                </div>
                <div class="card">
                    <div class="card-value">5</div>
                    <div class="card-label">Total de doações</div>
                </div>
                <div class="card">
                    <div class="card-value">5</div>
                    <div class="card-label">Total de entregas</div>
                </div>
                <div class="card">
                    <div class="card-value">5</div>
                    <div class="card-label">Total de famílias atendidas</div>
                </div>
            </div>

            <div class="card" style="margin-bottom:20px;">
                <h3 style="font-size:14.5px; margin-bottom:14px;">Filtros</h3>
                <div class="filters-row" style="margin-bottom:0;">
                    <div class="field">
                        <label>Data inicial</label>
                        <input type="text" value="01/03/2026" placeholder="DD/MM/AAAA"
                               maxlength="10" inputmode="numeric" data-mask="date">
                    </div>
                    <div class="field">
                        <label>Data final</label>
                        <input type="text" value="30/04/2026" placeholder="DD/MM/AAAA"
                               maxlength="10" inputmode="numeric" data-mask="date">
                    </div>
                    <div class="field">
                        <label>Família</label>
                        <select>
                            <option>Todas as famílias</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Tipo de doação</label>
                        <select>
                            <option>Todos os tipos</option>
                        </select>
                    </div>
                </div>

                <div style="margin-top:16px;">
                    <button class="btn btn-save" onclick="showToast('Relatório gerado com sucesso.')">Gerar relatório</button>
                </div>
            </div>

        <div class="table-conteiner">
            <table>
                <thead>
                    <tr>
                        <th>Família</th><th>CPF</th><th>Nº de membros</th><th>Doação recebida</th><th>Quantidade</th><th>Data da entrega</th>
                    </tr>
                </thead>

                <tbody id="tbody-relatorios">
                    <!-- preenchido pelo JavaScript -->
                </tbody>
            </table>

        </section> 
        
    </div>    

    <script src="script/menu.js"></script>
    <script src="script/field-formats.js"></script>
</body>
</html>
