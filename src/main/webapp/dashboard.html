<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/dashboard.css">
    <link rel="stylesheet" href="style/popups.css">
</head>

<body data-page="dashboard">

    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <div class="conteiner">
            <h1>Dashboard</h1>
            <p>Resumo geral das famílias, doações e entregas cadastradas.</p>

            <div id="dashboard-message" class="dashboard-message" role="alert" aria-live="polite"></div>

            <div class="cards">
                <div class="card">
                    <div class="card-icon" style="background:rgba(76,126,168,0.18); color:var(--save);">
                        <i class="fa-solid fa-people-group" ></i>
                    </div>

                    <div class="card-value" id="dashboard-total-families">0</div>
                    <div class="card-label">Total de famílias cadastradas</div>
                </div>

                <div class="card">
                    <div class="card-icon" style="background:rgba(78,155,118,0.18); color:var(--report);">
                        <i class="fa-solid fa-cube"></i>
                    </div>

                    <div class="card-value" id="dashboard-total-donations">0</div>
                    <div class="card-label">Total de doações cadastradas</div>
                </div>

                <div class="card">
                    <div class="card-icon" style="background:rgba(107,140,174,0.18); color:var(--view);">
                        <i class="fa-solid fa-truck"></i>
                    </div>

                    <div class="card-value" id="dashboard-total-deliveries">0</div>
                    <div class="card-label">Total de entregas realizadas</div>
                </div>

                <div class="card">
                    <div class="card-icon" style="background:rgba(201,162,75,0.18); color:var(--edit);">
                        <i class="fa-solid fa-people-group" ></i>
                    </div>

                    <div class="card-value" id="dashboard-attended-families">0</div>
                    <div class="card-label">Total de famílias atendidas</div>
                </div>

            </div>

            <div class="card">
                <h3>Atividades Recentes</h3>

                <div class="lista-ativ" id="dashboard-recent-activities">
                    <div class="item-ativ empty-activity">Carregando atividades...</div>
                </div>

            </div>
        </div>

    </div>

    <script src="script/menu.js"></script>
    <script src="script/dashboard.js"></script>

</body>
</html>
