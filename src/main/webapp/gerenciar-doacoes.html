<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Doações</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/popups.css">
    <link rel="stylesheet" href="style/gerenciar.css">
</head>
<body data-page="doacoes">
    
    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <section class="conteiner" id="page-gerenciar-doacoes">
            
            <div class="page-header">
                <div>
                    <h1>Gerenciar Doações</h1>
                    <p>Consulte o estoque, edite ou remova doações cadastradas.</p>
                </div>
                <button class="btn btn-save" onclick="window.location.href='cadastrar-doacao.html'">Cadastrar nova doação</button>
            </div>

            <div id="donation-message" class="page-message" role="alert" aria-live="polite"></div>

            <div class="list-toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="donation-search" placeholder="Buscar doação...">
                </div>
            </div>

            <div class="table-conteiner">
                <table id="table-doacoes">
                    <thead>
                        <tr>
                            <th>Tipo</th><th>Descrição</th><th>Original</th><th>Disponível</th><th>Entregue</th><th>Data da doação</th><th>Observação</th><th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tbody-doacoes">
                        <!-- preenchido pelo JavaScript -->
                    </tbody>
                </table>
            </div>

        </section>
    
    </div>
    
    <script src="script/menu.js"></script>
    <script src="script/field-formats.js?v=20261012-2"></script>
    <script src="script/geren-doacoes.js?v=20261012-2"></script>
</body>
</html>
