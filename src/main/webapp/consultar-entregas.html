<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Entregas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/popups.css">
    <link rel="stylesheet" href="style/gerenciar.css">
    <link rel="stylesheet" href="style/cadastrar.css">
</head>
<body>
    
    <div id="sidebar-slot"></div>

    <div id="popup-slot"></div>

    <div class="main-content">

        <div id="topbar-slot"></div>

        <section class="conteiner" id="page-consultar-entrega">
            
            <div class="page-header">
                <div>
                    <h1>Consultar Entregas</h1>
                    <p>Histórico de entregas de doações realizadas às famílias.</p>
                </div>
                <button class="btn btn-save" onclick="window.location.href='registrar-entrega.html'">Registrar nova entrega</button>
            </div>

            <div class="list-toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar entrega..." oninput="filterTable(this,'table-entregas')">
                </div>
            </div>

            <div class="filters-row">
                <div class="field">
                    <label>Filtrar por família</label>
                    <select>
                        <option>Todas as famílias</option>
                    </select>
                </div>

                <div class="field">
                    <label>Filtrar por data</label>
                    <input type="date">
                </div>

                <div class="field">
                    <label>Filtrar por tipo de doação</label>
                    <select>
                        <option>Todos os tipos</option>
                    </select>
                </div>        
            </div>
        
            <div class="table-conteiner">
                <table id="table-entregas">
                    <thead>
                        <tr>
                            <th>Família</th><th>Doação</th><th>Quantidade entregue</th><th>Data da entrega</th><th>Observação</th><th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="tbody-entregas">
                        <!-- preenchido pelo JavaScript -->
                    </tbody>

                </table>
            </div>
        
        </section>
    
    </div>    

    <script src="script/menu.js"></script>
    <script src="script/consul-entregas.js"></script>
</body>
</html>
